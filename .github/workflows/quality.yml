name: Quality

on:
  push:
    branches: [test, run]
  pull_request:
    branches: [test, run]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/agent_test
      TEST_DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/agent_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check app tests
      - name: Migrate integration database
        run: uv run --locked --extra dev alembic upgrade head
      - name: Run deterministic agent evaluations
        run: uv run --locked --extra dev python -m app.evals
      - name: Test with coverage gate
        run: uv run --locked --extra dev pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -q
      - name: Audit backend dependencies
        run: uv run --locked --extra dev pip-audit --local --skip-editable
      - name: Check isolated Fetch MCP lock
        run: uv lock --project ../mcp/fetch --check
      - name: Audit Fetch MCP dependencies
        if: matrix.python-version == '3.12'
        run: |
          uv export --project ../mcp/fetch --frozen --no-hashes --no-emit-project --output-file /tmp/agentdemo-fetch.txt
          uv run --locked --extra dev pip-audit --no-deps --disable-pip -r /tmp/agentdemo-fetch.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
