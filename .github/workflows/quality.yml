name: Quality

on:
  push:
    branches: [test, run]
  pull_request:
    branches: [test, run]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check app tests
      - name: Run deterministic agent evaluations
        run: uv run --locked --extra dev python -m app.evals
      - name: Test with coverage gate
        run: uv run --locked --extra dev pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -q
      - name: Audit backend dependencies
        run: uv run --locked --extra dev pip-audit --local --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
