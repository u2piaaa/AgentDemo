[project]
name = "personal-agent-backend"
version = "0.1.0"
description = "Local personal AI agent backend with FastAPI, LangGraph, PostgreSQL, and pgvector."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "pgvector>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "sse-starlette>=2.1.0",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.evals" = ["scenarios.json"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: calls paid or account-bound external services (opt in with -m live)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI deterministic across Ruff releases. These are Ruff's historical
# default correctness checks; broader rule families are introduced separately
# once their existing findings have been addressed.
select = ["E4", "E7", "E9", "F"]
