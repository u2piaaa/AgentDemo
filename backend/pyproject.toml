[project]
name = "personal-agent-backend"
version = "0.1.0"
description = "Local personal AI agent backend with FastAPI, LangGraph, PostgreSQL, and pgvector."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0,<2",
    "anyio>=4.15.1,<5",
    "argon2-cffi>=25.1.0,<26",
    "asyncpg>=0.32.0,<1",
    "fastapi>=0.143.1,<1",
    "httpx>=0.28.1,<1",
    "httpx2>=2.13.1,<3",
    "jsonschema>=4.26.0,<5",
    "langgraph>=1.2.15,<2",
    "mcp>=2.3.0,<3",
    "pgvector>=0.5.1,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "pypdf>=6.21.2,<7",
    "python-multipart>=0.0.32,<1",
    "referencing>=0.37.0,<1",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "sse-starlette>=3.5.0,<4",
    "tiktoken>=0.14.0,<1",
    "tzdata>=2026.2; sys_platform == 'win32'",
    "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.0,<1",
    "pip-audit>=2.10.1,<3"
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.evals" = ["scenarios.json"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: calls paid or account-bound external services (opt in with -m live)",
    "integration: requires a migrated PostgreSQL database in TEST_DATABASE_URL",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI deterministic across Ruff releases. These are Ruff's historical
# default correctness checks; broader rule families are introduced separately
# once their existing findings have been addressed.
select = ["E4", "E7", "E9", "F"]
